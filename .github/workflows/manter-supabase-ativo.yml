# O plano gratuito do Supabase pausa o projeto depois de 7 dias sem uso.
# Esta tarefa faz uma consulta leve a cada 3 dias para mantê-lo ativo.
# Precisa dos segredos SUPABASE_URL e SUPABASE_ANON_KEY em
# Settings > Secrets and variables > Actions do repositório.
name: Manter Supabase ativo

on:
  schedule:
    - cron: '17 11 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Cadastre os segredos SUPABASE_URL e SUPABASE_ANON_KEY no repositório."
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/configuracoes?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Resposta do Supabase: $status"
          [ "$status" = "200" ]
