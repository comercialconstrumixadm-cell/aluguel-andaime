# O plano gratuito do Supabase pausa o projeto depois de 7 dias sem uso.
# Esta tarefa faz consultas leves todo dia para mantê-lo ativo.
# Precisa dos segredos SUPABASE_URL e SUPABASE_ANON_KEY em
# Settings > Secrets and variables > Actions do repositório.
name: Manter Supabase ativo

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Cadastre os segredos SUPABASE_URL e SUPABASE_ANON_KEY no repositório."
            exit 1
          fi
          consultar() {
            curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$1" \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" || echo "sem-resposta"
          }
          banco=$(consultar "$SUPABASE_URL/rest/v1/configuracoes?select=id&limit=1")
          login=$(consultar "$SUPABASE_URL/auth/v1/health")
          echo "Banco: $banco | Login: $login"
          if [ "$banco" != "200" ]; then
            echo "::error::O Supabase não respondeu. Provavelmente o projeto foi pausado: abra supabase.com/dashboard e clique em Resume project."
            exit 1
          fi
